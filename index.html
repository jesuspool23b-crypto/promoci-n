<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Interactiva</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #2c5aa0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Contenedor de estrellas */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Estilos para las estrellas con forma de estrella de 5 picos */
        .star {
            position: absolute;
            filter: drop-shadow(0 0 8px rgba(255, 235, 59, 0.8));
            animation: twinkle 3s infinite;
        }

        /* SVG estrella dentro del contenedor */
        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .star {
            animation: twinkle 3s infinite, float 6s infinite ease-in-out;
        }

        .calculator-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #1e3a8a;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #1e3a8a;
        }

        .btn-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-sumar { background-color: #2ecc71; }
        .btn-sumar:hover { background-color: #27ae60; }

        .btn-restar { background-color: #e74c3c; }
        .btn-restar:hover { background-color: #c0392b; }

        .btn-multiplicar { background-color: #f39c12; }
        .btn-multiplicar:hover { background-color: #d35400; }

        .btn-dividir { background-color: #3498db; }
        .btn-dividir:hover { background-color: #2980b9; }

        .btn-limpiar {
            background-color: #1e3a8a;
            grid-column: span 2;
        }
        .btn-limpiar:hover { background-color: #1a2f6f; }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f0f4ff;
            border-left: 5px solid #1e3a8a;
            border-radius: 4px;
            text-align: center;
        }

        .result-box p {
            font-size: 14px;
            color: #1e3a8a;
            font-weight: 600;
        }

        .result-box span {
            display: block;
            font-size: 24px;
            font-weight: bold;
            color: #1e3a8a;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- Contenedor de estrellas -->
    <div class="stars-container" id="starsContainer"></div>

    <div class="calculator-card">
        <h2>Calculadora</h2>
        
        <div class="input-group">
            <label for="num1">Primer Número</label>
            <input type="number" id="num1" placeholder="Ej. 10">
        </div>

        <div class="input-group">
            <label for="num2">Segundo Número</label>
            <input type="number" id="num2" placeholder="Ej. 5">
        </div>

        <div class="btn-container">
            <button class="btn-sumar" onclick="calcular('sumar')">Sumar (+)</button>
            <button class="btn-restar" onclick="calcular('restar')">Restar (-)</button>
            <button class="btn-multiplicar" onclick="calcular('multiplicar')">Multiplicar (×)</button>
            <button class="btn-dividir" onclick="calcular('dividir')">Dividir (÷)</button>
            <button class="btn-limpiar" onclick="limpiar()">Limpiar</button>
        </div>

        <div class="result-box">
            <p>Resultado:</p>
            <span id="resultado">0</span>
        </div>
    </div>

    <script>
        // Función para crear una estrella de 5 picos con SVG
        function crearEstrellaSVG(tamaño) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.setAttribute('width', tamaño);
            svg.setAttribute('height', tamaño);
            
            // Crear los puntos de la estrella de 5 picos
            const puntos = [];
            for (let i = 0; i < 10; i++) {
                const angulo = (i * Math.PI) / 5 - Math.PI / 2;
                const radio = i % 2 === 0 ? 50 : 20;
                const x = 50 + radio * Math.cos(angulo);
                const y = 50 + radio * Math.sin(angulo);
                puntos.push([x, y]);
            }
            
            // Crear el polígono
            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            polygon.setAttribute('points', puntos.map(p => p.join(',')).join(' '));
            polygon.setAttribute('fill', '#ffeb3b');
            polygon.setAttribute('stroke', '#fdd835');
            polygon.setAttribute('stroke-width', '2');
            
            svg.appendChild(polygon);
            return svg;
        }

        // Función para generar estrellas
        function generarEstrellas() {
            const container = document.getElementById('starsContainer');
            const numeroEstrellas = 80;

            for (let i = 0; i < numeroEstrellas; i++) {
                const starContainer = document.createElement('div');
                starContainer.classList.add('star');

                // Tamaño más grande para las estrellas
                const tamaño = Math.random() * 8 + 12;

                // Crear el SVG de la estrella
                const svgStar = crearEstrellaSVG(tamaño);
                starContainer.appendChild(svgStar);

                // Posición aleatoria
                starContainer.style.left = Math.random() * window.innerWidth + 'px';
                starContainer.style.top = Math.random() * window.innerHeight + 'px';

                // Duración de animación aleatoria
                const duracion = Math.random() * 2 + 2;
                starContainer.style.animationDuration = duracion + 's';

                // Retraso aleatorio
                const retraso = Math.random() * 3;
                starContainer.style.animationDelay = retraso + 's';

                container.appendChild(starContainer);
            }
        }

        // Llamar a la función al cargar la página
        generarEstrellas();

        // Regenerar estrellas al cambiar el tamaño de la ventana
        window.addEventListener('resize', () => {
            const container = document.getElementById('starsContainer');
            container.innerHTML = '';
            generarEstrellas();
        });

        function calcular(operacion) {
            // Obtenemos las referencias a los elementos del DOM
            const input1 = document.getElementById('num1');
            const input2 = document.getElementById('num2');
            const contenedorResultado = document.getElementById('resultado');

            // Obtenemos los valores de los inputs y los convertimos a números flotantes
            const n1 = parseFloat(input1.value);
            const n2 = parseFloat(input2.value);

            // Validación: Verificar si los campos están vacíos o no son números válidos
            if (!input1.value || !input2.value || isNaN(n1) || isNaN(n2)) {
                contenedorResultado.innerText = "Error: Ingresa ambos números";
                contenedorResultado.style.color = "#e74c3c";
                return;
            }

            let resultado = 0;

            // Estructura de control para decidir la operación
            switch (operacion) {
                case 'sumar':
                    resultado = n1 + n2;
                    break;
                case 'restar':
                    resultado = n1 - n2;
                    break;
                case 'multiplicar':
                    resultado = n1 * n2;
                    break;
                case 'dividir':
                    // Validación especial: Evitar división por cero
                    if (n2 === 0) {
                        contenedorResultado.innerText = "Error: No se puede dividir por 0";
                        contenedorResultado.style.color = "#e74c3c";
                        return;
                    }
                    resultado = n1 / n2;
                    break;
            }

            // Mostramos el resultado final en pantalla, limitando los decimales si los hay
            contenedorResultado.innerText = Number(resultado.toFixed(4));
            contenedorResultado.style.color = "#1e3a8a";
        }

        function limpiar() {
            // Limpiamos los campos de entrada
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            
            // Limpiamos el resultado y lo restablecemos a 0
            const contenedorResultado = document.getElementById('resultado');
            contenedorResultado.innerText = '0';
            contenedorResultado.style.color = '#1e3a8a';
        }
    </script>

</body>
</html>
